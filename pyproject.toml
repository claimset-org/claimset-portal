[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claimset-portal"
version = "0.1.0"
description = "LibLM: the portal that publishes claimsets, research papers written for LLM readers."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [{name = "Claimset contributors"}]
dependencies = [
  # The claimset package is the single source of the format's rules: the portal calls it, never reimplements it.
  # Pinned to a commit; move the pin forward deliberately, with the spec version the portal accepts.
  "claimset @ git+https://github.com/claimset-org/claimset@75cae710fe2bf8103515717bb068344995399ef8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
claimset-portal = "claimset_portal.cli:main"

[project.urls]
Homepage = "https://github.com/claimset-org/claimset-portal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimset_portal = ["migrations/*.sql", "static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
