name: Classifier image

# Builds the classifier image when it changes: downloads the model and OpenAlex's topic list, and fails if a model
# label matches no OpenAlex topic.
on:
  pull_request:
    paths: ["classifier/**", ".github/workflows/classifier.yml"]
  push:
    branches: [main]
    paths: ["classifier/**", ".github/workflows/classifier.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t liblm-classifier classifier
      - name: Classify a sample text
        run: |
          docker run -d --name clf -p 8001:8001 liblm-classifier
          for i in $(seq 1 60); do curl -sf localhost:8001/healthz && break; sleep 2; done
          curl -sf -X POST localhost:8001/classify -H 'Content-Type: application/json' \
            -d '{"title": "Forecasting retail demand with exponential smoothing", "abstract": "Exponential smoothing models with multiple seasonal patterns forecast hourly electricity demand more accurately than ARIMA."}' \
            | tee /dev/stderr | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['subfield'].startswith('openalex:subfields/') and 1 <= len(d['topics']) <= 3"
